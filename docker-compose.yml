services:
  api:
    build: .
    image: minute-market-data:latest
    ports:
      - "8000:8000"
      # UDP port the demo collector listens on for realtime datagrams.
      - "9001:9001/udp"
    environment:
      MARKET_DB: /data/market.db
    volumes:
      - market-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Local example source: streams the day over UDP with reordering, drops and
  # duplicates, and serves the retained full day over HTTP for backfill.
  source:
    build: .
    image: minute-market-data:latest
    command: ["uvicorn", "source.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    environment:
      SYMBOL: DEMO
      # TRADE_DATE defaults to today (UTC); the streamer plays that day.
      UDP_TARGET_HOST: api
      UDP_TARGET_PORT: "9001"
      UDP_INTERVAL_SECONDS: "0.2"
      # seqs 7, 13 and 22 never arrive via UDP: backfill must supply them.
      UDP_DROP_SEQS: "7,13,22"
      # seqs 4 and 18 arrive twice: duplicates must not be stored twice.
      UDP_DUPLICATE_SEQS: "4,18"
      # messages are emitted in reversed windows of 3: out-of-order delivery.
      UDP_REORDER_WINDOW: "3"
      # the backfill endpoint answers 503 between t=25s and t=35s.
      HTTP_DOWN_WINDOWS: "25-35"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  market-data:
